name: LAN build

# Builds the self-hosted LAN composition for a fork: the desktop installers,
# the CLI tarball a server installs, and the install scripts, published as one
# rolling release. Upstream ships from its own pipeline and never runs this.
#
# - dev-v<upstream>-lan.<n> builds everything and publishes it to the `lan-dev`
#   prerelease, for machines installed from it to try a branch first.
# - dev-v<upstream>-lan.<n>-cli builds the CLI tarball only. `lan-dev` keeps
#   the files of its last whole build, `lody-lan-cli.tgz` included, and its
#   manifest goes on describing that build at the top level, which is all a
#   desktop, the install script and an older agent service read. The new
#   tarball is uploaded beside it as `lody-lan-cli-<version>.tgz` and named
#   under `cli`, which a newer agent service installs.
# - v<upstream>-lan.<n> publishes to `lan-latest`, which everyone else follows.
#   When `lan-dev` carries a whole build of the same commit under the same
#   version, its files are published again instead of being built a second
#   time; the version is inside every file, so tag the dev number
#   (dev-v0.104.0-lan.5 is released as v0.104.0-lan.5). Otherwise everything
#   is built. A release tag never builds the CLI only.
#   The CLI tarball is stamped again to follow `lan-latest`. The desktop
#   installers keep the stamp of `lan-dev`: a desktop follows the release it
#   recorded on its first start (and may switch in Settings > LAN). So both
#   releases have to carry a build that records it, one whose manifest has
#   `cli`, before a release reuses anything; the first release after that
#   change is built in full. Accepted gaps: a desktop installed afresh from a
#   reused installer, and a desktop that skipped every newer build and updates
#   straight to a reused one, follow `lan-dev` and have to be switched by hand.
#
# Running it by hand builds without publishing, unless it runs on one of these
# tags; `build: cli` then does what the `-cli` suffix does.
on:
  push:
    tags:
      - 'v*-lan.*'
      - 'dev-v*-lan.*'
  workflow_dispatch:
    inputs:
      build:
        description: 'full, or cli: the CLI tarball only, keeping the desktop installers of the release'
        type: choice
        options: [full, cli]
        default: full

permissions:
  contents: read

concurrency:
  group: lan-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  LAN_RELEASE_TAG: ${{ startsWith(github.ref_name, 'dev-') && 'lan-dev' || 'lan-latest' }}
  LAN_PRERELEASE: ${{ startsWith(github.ref_name, 'dev-') && '--prerelease' || '' }}

jobs:
  # Decides the version and what to build before anything is installed.
  plan:
    name: Plan
    if: github.repository != 'LodyAI/Lody'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # A build off a branch numbers itself after the release tags.
          fetch-depth: ${{ github.ref_type == 'tag' && 1 || 0 }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Read both releases
        if: github.ref_type == 'tag' && !startsWith(github.ref_name, 'dev-')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for release in lan-dev lan-latest; do
            # A download that breaks off leaves part of the file behind.
            gh release download "$release" --pattern manifest.json --dir "$RUNNER_TEMP/$release" || {
              rm -f "$RUNNER_TEMP/$release/manifest.json"
              echo "$release could not be read; everything is built."
            }
          done

      - name: Plan the build
        id: plan
        env:
          LAN_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          LAN_BUILD: ${{ inputs.build }}
        run: |
          node scripts/lan-release.mjs plan ${LAN_TAG:+--tag "$LAN_TAG"} --build "$LAN_BUILD" \
            --commit "$GITHUB_SHA" --dev-manifest "$RUNNER_TEMP/lan-dev/manifest.json" \
            --stable-manifest "$RUNNER_TEMP/lan-latest/manifest.json"

  # The renderer build needs more memory than a hosted macOS runner has, and
  # its output is the same on every host, so it is built once here and only
  # packaged per platform.
  bundles:
    name: Build bundles
    needs: plan
    if: needs.plan.outputs.build != 'reuse'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp build version
        env:
          LAN_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/lan-release.mjs version --set "$LAN_VERSION" --write

      - name: Build CLI and desktop bundles
        env:
          # Stamped into both bundles: the releases a build follows are the
          # ones of the repository that built it.
          LODY_LAN_REPOSITORY: ${{ github.repository }}
          LODY_LAN_TAG: ${{ env.LAN_RELEASE_TAG }}
          LODY_LAN_COMMIT: ${{ github.sha }}
        run: pnpm --dir apps/electron run build

      - name: Pack CLI
        run: pnpm --dir apps/cli pack --pack-destination "$RUNNER_TEMP/lan-cli"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: lan-bundles
          # Both paths keep their position below `apps/`, which is where the
          # packaging jobs restore them.
          path: |
            apps/electron/out
            apps/cli/dist
          if-no-files-found: error
          retention-days: 3

      - name: Upload CLI tarball
        uses: actions/upload-artifact@v4
        with:
          name: lan-cli
          path: ${{ runner.temp }}/lan-cli/*.tgz
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Package desktop (${{ matrix.id }})
    needs: [plan, bundles]
    if: needs.plan.outputs.build == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac
            os: macos-15
            # Without Apple credentials electron-builder skips notarization.
            flags: --mac --arm64 --x64
          - id: win
            os: windows-latest
            flags: --win --x64
          - id: linux
            os: ubuntu-latest
            flags: --linux AppImage --x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp build version
        shell: bash
        env:
          LAN_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/lan-release.mjs version --set "$LAN_VERSION" --write

      - name: Restore bundles
        uses: actions/download-artifact@v4
        with:
          name: lan-bundles
          path: apps

      - name: Stage embedded CLI
        run: pnpm --dir apps/electron run sync:cli

      # macOS keys the permissions a user grants (the Documents folder, for
      # one) to the identity an application is signed with. An unsigned build
      # gets an ad-hoc identity that changes with every build, so every update
      # asked again. A fork that stores a code-signing certificate as the
      # secrets below signs every build with it and keeps one identity; one
      # without it builds unsigned as before.
      #
      # The certificate is a Developer ID certificate or one of the fork's own.
      # The workflow never asks Apple for one: a runner keeps no key, so every
      # build would use up one more of the few an account may have.
      - name: Read the signing certificate
        id: signing
        if: matrix.id == 'mac'
        shell: bash
        env:
          SIGNING_P12: ${{ secrets.LAN_MAC_SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.LAN_MAC_SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_P12" ]; then
            echo "No signing certificate; the application stays unsigned."
            exit 0
          fi
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -clcerts -nokeys \
            -passin env:SIGNING_PASSWORD -out "$RUNNER_TEMP/signing.pem"
          rm -f "$RUNNER_TEMP/signing.p12"
          node scripts/lan-release.mjs signing --certificate "$RUNNER_TEMP/signing.pem"

      # Nothing vouches for a certificate of the fork's own, so it is trusted
      # for code signing on this throwaway runner only, which is what lets
      # electron-builder use it. It carries no Team ID either, and under the
      # hardened runtime an application loads only what Apple signed or what
      # carries its own: `LODY_MAC_SELF_SIGNED` signs the application with the
      # exception that lets it load its own frameworks.
      - name: Trust the fork's own certificate
        if: matrix.id == 'mac' && steps.signing.outputs.self_signed == '1'
        shell: bash
        run: |
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"

      - name: Package
        shell: bash
        env:
          LAN_VERSION: ${{ needs.plan.outputs.version }}
          # Never search the runner keychain; the only identity is the one named here.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ matrix.id == 'mac' && secrets.LAN_MAC_SIGNING_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.id == 'mac' && secrets.LAN_MAC_SIGNING_PASSWORD || '' }}
          CSC_NAME: ${{ steps.signing.outputs.name }}
          LODY_MAC_SELF_SIGNED: ${{ steps.signing.outputs.self_signed }}
        run: pnpm --dir apps/electron run package -- ${{ matrix.flags }} "--version=$LAN_VERSION"

      # The probes of the packaging hooks run before the application is signed,
      # and a signature decides what a process may load. What is published is
      # started here as it ships: the application, which has to load its
      # framework, and the helper that runs the agent service with its bindings.
      - name: Start the signed application
        if: matrix.id == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          for app in "$PWD"/apps/electron/dist/mac*/*.app; do
            echo "== $app"
            codesign -dvv "$app" 2>&1 | grep -E '^(Authority|Identifier|Signature|TeamIdentifier|CodeDirectory)=' || true
            codesign -d -r- "$app" 2>&1 | grep designated || true
            codesign -d --entitlements - "$app" 2>&1 | grep -F 'com.apple.security' || true

            name="$(basename "$app" .app)"
            application="$app/Contents/MacOS/$name"
            helper="$app/Contents/Frameworks/$name Helper.app/Contents/MacOS/$name Helper"
            cli="$app/Contents/Resources/app.asar.unpacked/resources/cli/index.js"
            if [[ " $(lipo -archs "$application") " != *" $(uname -m) "* ]] &&
              ! arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "This runner cannot run $(lipo -archs "$application"); not started."
              continue
            fi
            ELECTRON_RUN_AS_NODE=1 "$application" -e \
              'console.log("application", process.versions.electron, process.arch)'
            ELECTRON_RUN_AS_NODE=1 "$helper" "$cli" --version
            ELECTRON_RUN_AS_NODE=1 "$helper" -e '
              const { createRequire } = require("node:module")
              const load = createRequire(process.argv[1])
              const Database = load("better-sqlite3")
              new Database(":memory:").close()
              if (typeof load("@lydell/node-pty").spawn !== "function") process.exit(1)
              console.log("helper", process.arch, "loads its bindings")
            ' "$cli"
          done

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: lan-desktop-${{ matrix.id }}
          path: |
            apps/electron/dist/*.dmg
            apps/electron/dist/*.zip
            apps/electron/dist/*.exe
            apps/electron/dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish rolling release
    needs: [plan, bundles, desktop]
    # After the builds the plan asked for; a reused build asks for none.
    if: >-
      !failure() && !cancelled() && github.ref_type == 'tag' &&
      needs.plan.result == 'success'
    # Reading what the release lists, assembling and uploading is one step for
    # the release: a CLI-only build carries the files the release lists, which
    # another tag publishing meanwhile would replace. Builds stay per tag.
    concurrency:
      group: lan-publish-${{ startsWith(github.ref_name, 'dev-') && 'lan-dev' || 'lan-latest' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build outputs
        if: needs.plan.outputs.build != 'reuse'
        uses: actions/download-artifact@v4
        with:
          pattern: lan-{cli,desktop-*}
          path: ${{ runner.temp }}/lan-artifacts

      # A CLI-only build keeps the desktop installers the release lists now.
      - name: Read the published manifest
        if: needs.plan.outputs.build == 'cli'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$LAN_RELEASE_TAG" --pattern manifest.json \
            --dir "$RUNNER_TEMP/lan-published"

      - name: Assemble release
        if: needs.plan.outputs.build != 'reuse'
        env:
          LAN_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node scripts/lan-release.mjs assemble \
            --version "$LAN_VERSION" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$LAN_RELEASE_TAG" \
            --artifacts "$RUNNER_TEMP/lan-artifacts" \
            --carry "$RUNNER_TEMP/lan-published/manifest.json" \
            --out "$RUNNER_TEMP/lan-release" \
            --notes "$RUNNER_TEMP/lan-release-notes.md"

      - name: Download the dev build
        if: needs.plan.outputs.build == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download lan-dev --dir "$RUNNER_TEMP/lan-dev"
          gh release download "$LAN_RELEASE_TAG" --pattern manifest.json \
            --dir "$RUNNER_TEMP/lan-published"

      - name: Assemble release from the dev build
        if: needs.plan.outputs.build == 'reuse'
        env:
          LAN_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node scripts/lan-release.mjs promote \
            --from "$RUNNER_TEMP/lan-dev" \
            --version "$LAN_VERSION" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$LAN_RELEASE_TAG" \
            --stable-manifest "$RUNNER_TEMP/lan-published/manifest.json" \
            --out "$RUNNER_TEMP/lan-release" \
            --notes "$RUNNER_TEMP/lan-release-notes.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LAN_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$LAN_RELEASE_TAG" >/dev/null 2>&1; then
            # Move the tag first: the release keeps its download addresses and
            # the files below replace the previous build in place.
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$LAN_RELEASE_TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$LAN_RELEASE_TAG" $LAN_PRERELEASE \
              --title "Lody OSS LAN${LAN_PRERELEASE:+ dev} $LAN_VERSION" \
              --notes-file "$RUNNER_TEMP/lan-release-notes.md"
          else
            gh release create "$LAN_RELEASE_TAG" $LAN_PRERELEASE \
              --target "$GITHUB_SHA" \
              --title "Lody OSS LAN${LAN_PRERELEASE:+ dev} $LAN_VERSION" \
              --notes-file "$RUNNER_TEMP/lan-release-notes.md"
          fi
          gh release upload "$LAN_RELEASE_TAG" "$RUNNER_TEMP"/lan-release/* --clobber
